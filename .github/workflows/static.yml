name: Deploy Hexo to GitHub Pages

on:
  push:
    branches: ["main"]
  # 增加下面这几行：当 AI 工作流成功结束时自动运行此部署流程
  workflow_run:
    workflows: ["AI Auto Post Generator"]
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # 增加状态过滤：仅在 AI 脚本成功执行时才触发部署
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Hexo
        run: |
          npx hexo clean
          npx hexo generate

      - name: Verify build output
        run: |
          ls -la public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
