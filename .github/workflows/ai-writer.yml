name: AI Auto Post Generator

on:
  schedule:
    # 避开整点高峰：UTC 时间 23:25（对应北京时间每天早晨 07:25）自动触发
    - cron: '25 23 * * *'
  workflow_dispatch: # 保留手动触发按钮，方便随时手动补发

jobs:
  write-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate AI Post with DeepSeek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python - << 'EOF'
          import os
          import requests
          from datetime import datetime

          api_key = os.environ.get("DEEPSEEK_API_KEY")
          if not api_key:
              raise ValueError("Missing DEEPSEEK_API_KEY secret")

          today_str = datetime.now().strftime("%Y-%m-%d")
          file_name = f"source/_posts/{today_str}-ai-news.md"

          # 包含精简过滤规则与格式控制的 Prompt
          prompt = f"""
          你是一个专业的 AI 行业资深分析师。请为今天的“AI 每日资讯速递”撰写一篇简报。

          【筛选与过滤规则】
          1. 严禁包含：未经证实的八卦炒作、纯概念性的融资金额宣布（除非金额极其巨大或涉及顶级实验室）、小厂的营销软文。
          2. 优先挑选：有代码开源、有论文发布、有实际产品上线、对行业架构有颠覆性影响的动态。
          3. 严格控制数量：从今日所有新闻中精选出最具备决定性意义的 3~5 条，多一条都不写。

          【排版格式要求】
          - 不要输出全局大标题（如 # AI 每日资讯速递），开头直接用一段简短的话引入。
          - 采用 Markdown 格式，每条新闻使用加粗小标题（如 ## 1. 标题名称），并附带 2~3 句核心要点与影响分析。
          - 语言精炼，突出硬核技术与落地价值。
          """

          url = "https://api.deepseek.com/chat/completions"
          headers = {
              "Content-Type": "application/json",
              "Authorization": f"Bearer {api_key}"
          }
          data = {
              "model": "deepseek-chat",
              "messages": [
                  {"role": "system", "content": "你是一位优秀的 AI 科技博主，擅长筛选并撰写高质量的 AI 前沿动态。"},
                  {"role": "user", "content": prompt}
              ],
              "temperature": 0.7
          }

          response = requests.post(url, json=data, headers=headers)
          response.raise_for_status()
          content = response.json()["choices"][0]["message"]["content"]

          # 生成符合 Hexo 标准 Front-matter 头部的 Markdown 文件
          file_content = f"""---
          title: AI 每日资讯速递 ({today_str})
          date: {today_str} 08:00:00
          tags:
            - AI
            - 科技新闻
          ---

          {content}
          """

          os.makedirs("source/_posts", exist_ok=True)
          with open(file_name, "w", encoding="utf-8") as f:
              f.write(file_content.strip())

          print(f"Post created successfully: {file_name}")
          EOF

      - name: Deploy Hexo Site
        run: |
          npm install
          npx hexo clean
          npx hexo generate

      - name: Commit and Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]"
          git add source/_posts/
          git commit -m "Auto: generate AI news for $(date +'%Y-%m-%d')" || exit 0
          git push
